<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft Overlord</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
    --tx:#e6edf3; --dim:#8b98a5; --faint:#5a6672;
    --safe:#3fb950; --coin:#d29922; --gone:#f85149; --me:#58a6ff;
    --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,sans-serif}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  header{position:sticky;top:0;z-index:10;background:var(--panel);
         border-bottom:1px solid var(--line);padding:8px 10px}
  .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.live{background:var(--safe);box-shadow:0 0 8px var(--safe)}
  .dot.manual,.dot.offline{background:var(--faint)}
  .dot.auth,.dot.notfound,.dot.network,.dot.error,.dot.http{background:var(--gone)}
  .clock{font-size:19px;font-weight:650}
  .until{color:var(--dim)}
  .until b{color:var(--accent);font-size:15px}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);
         border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--faint)}
  button:active{transform:translateY(1px)}

  .slotpick{color:var(--dim);font-size:11px}
  select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);
         border-radius:6px;padding:3px 5px;font-size:12px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .chip{padding:2px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line);
        background:var(--panel2);color:var(--dim)}
  .chip.need{border-color:var(--gone);color:#ffb4ae}
  .chip.cliff{border-color:var(--coin);color:#ffd479}
  .chip.have{color:var(--dim)}

  nav{display:flex;gap:4px;padding:7px 10px;background:var(--panel);
      border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{white-space:nowrap}
  nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .banner{padding:6px 10px;font-size:12px;background:#3d1d1d;color:#ffb4ae;
          border-bottom:1px solid var(--gone)}
  .banner.warn{background:#3a2d10;color:#ffd479;border-color:var(--coin)}

  table{width:100%;border-collapse:collapse}
  tr.tierhdr td{background:var(--panel2);color:var(--dim);font-size:11px;
                letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;
                border-top:1px solid var(--line);position:sticky;top:0}
  tbody tr.p{border-bottom:1px solid #1b2027;cursor:pointer}
  tbody tr.p:hover{background:#1a2029}
  td{padding:5px 6px;vertical-align:middle}
  td.rk{width:34px;color:var(--faint);text-align:right;padding-left:10px}
  td.nm{font-weight:520}
  .meta{color:var(--faint);font-size:11px;margin-left:5px;font-weight:400}
  td.sv{width:58px;text-align:right}
  td.act{width:30px;text-align:center;color:var(--faint)}
  td.act:hover{color:var(--me)}
  .b{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid}
  .b.safe{color:var(--safe);border-color:#1f4620}
  .b.coinflip{color:var(--coin);border-color:#4a3a12}
  .b.gone{color:var(--gone);border-color:#5a2320}
  .b.unknown{color:var(--faint);border-color:var(--line)}
  .flag{color:var(--coin);font-size:11px;display:block;margin-top:1px}
  .dl{color:var(--safe);font-size:11px}

  tr.taken{opacity:.32}
  tr.taken td.nm{text-decoration:line-through}
  tr.mine{background:#10243d}
  tr.mine td.nm{color:var(--me)}

  .empty{padding:24px 10px;color:var(--faint);text-align:center}
  footer{padding:8px 10px;color:var(--faint);font-size:11px;
         border-top:1px solid var(--line)}

  /* need weighting */
  .tag{font-size:9px;padding:1px 4px;border-radius:3px;margin-left:5px;
       border:1px solid;vertical-align:middle}
  .tag.starter{color:var(--safe);border-color:#1f4620}
  .tag.flex{color:var(--dim);border-color:var(--line)}
  .tag.depth{color:var(--gone);border-color:#5a2320}
  .tag.sc{color:var(--accent);border-color:#3d2f7a;background:#1a1533}
  .chip.scarce{border-color:var(--accent);color:#c3b5ff}
  tr.dep td.nm{opacity:.62}
  .wasrank{color:var(--faint);font-size:10px}

  /* two-column shell: board + recent picks */
  .shell{display:grid;grid-template-columns:1fr 186px;align-items:start}
  .feed{position:sticky;top:0;border-left:1px solid var(--line);
        background:var(--panel);min-height:100vh}
  .feed h3{margin:0;padding:7px 9px;font-size:10px;letter-spacing:.06em;
           text-transform:uppercase;color:var(--dim);
           border-bottom:1px solid var(--line);display:flex;
           justify-content:space-between;align-items:center}
  .age{font-weight:400;text-transform:none;letter-spacing:0}
  .age.stale{color:var(--coin)}
  .age.dead{color:var(--gone)}
  .fp{padding:4px 9px;border-bottom:1px solid #1b2027;font-size:11px;
      animation:flash .9s ease-out}
  .fp.me{background:#10243d}
  .fp .n{display:block;color:var(--tx)}
  .fp .m{color:var(--faint);font-size:10px}
  .fp .pk{color:var(--faint);font-variant-numeric:tabular-nums;
          display:inline-block;min-width:26px}
  @keyframes flash{from{background:#243447}to{background:transparent}}
  @media (max-width:700px){
    .shell{grid-template-columns:1fr}
    .feed{position:static;min-height:0;border-left:0;
          border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <span class="dot offline" id="dot"></span>
    <span class="clock num" id="clock">—</span>
    <span class="until num" id="until"></span>
    <span class="spacer"></span>
    <button id="mode" title="Order by my board, or by board rank adjusted for roster needs">Weighted</button>
    <label class="slotpick">slot <select id="slot"></select></label>
    <button id="undo">Undo</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div id="banner"></div>

<nav id="tabs"></nav>

<div class="shell">
  <div>
    <table><tbody id="rows"></tbody></table>
    <footer id="foot">Click a row to cross a player off. Click <b>+</b> to add him to your roster.</footer>
  </div>
  <aside class="feed">
    <h3>Recent picks <span class="age" id="age"></span></h3>
    <div id="feed"></div>
  </aside>
</div>

<script>
const POS = ["ALL","RB","WR","TE","QB","DST","MINE"];
let pos = "ALL", last = null, weighted = true;
let lastCount = null, lastChange = Date.now();

const el = id => document.getElementById(id);

function tabs(){
  el("tabs").innerHTML = "";
  POS.forEach(p=>{
    const b=document.createElement("button");
    b.textContent=p; if(p===pos) b.className="on";
    b.onclick=()=>{pos=p;tabs();render(last)};
    el("tabs").appendChild(b);
  });
}

async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
    body:body?JSON.stringify(body):null});
  if(!r.ok) console.warn(url, await r.text());
}

function render(d){
  if(!d) return; last=d;

  // connection + clock
  const c=d.connection||{};
  el("dot").className="dot "+(c.status||"offline");
  const slotSet = d.league && d.league.my_slot != null;
  const total = (d.league.teams||10)*(d.rounds||16);
  el("clock").textContent = d.drafted_count >= total
    ? "Draft complete" : "Pick "+(d.on_the_clock||"—");
  el("until").innerHTML = d.next_pick
    ? `· yours <b>#${d.next_pick}</b> · <b>${d.picks_until}</b> away`
    : (slotSet
        ? `· <span style="color:var(--faint)">no picks left</span>`
        : `· <span style="color:var(--coin)">set your slot →</span>`);

  // banner for connection trouble
  const bad = ["auth","notfound","network","error","http"].includes(c.status);
  el("banner").innerHTML = bad
    ? `<div class="banner"><b>${c.status}</b> — ${c.detail} · board still works, cross players off by hand</div>`
    : (c.status==="manual"
        ? `<div class="banner warn">Manual mode — no ESPN config. Click rows to cross players off.</div>`
        : "");

  // chips: open slots, then tier cliffs
  const ch=[];
  // Scarcity leads: probability x cliff is sharper than a raw count, and
  // it's the thing that should change what you do right now.
  const scarce = (weighted ? (d.scarcity||[]) : []).filter(s=>s.bonus>=3);
  scarce.slice(0,3).forEach(s => ch.push(
    `<span class="chip scarce" title="cliff to next tier: ${s.cliff} ranks">`
    + `${s.pos} T${s.tier} ${Math.round(s.p_gone*100)}% gone by #${d.horizon}</span>`));
  const covered = new Set(scarce.map(s=>s.pos+"/"+s.tier));
  (d.cliffs||[]).filter(x=>x.cliff && !covered.has(x.pos+"/"+x.tier)).slice(0,2).forEach(x=>
    ch.push(`<span class="chip cliff">${x.pos} T${x.tier}: ${x.remaining} left</span>`));

  // Early on every slot is open, which makes "need" chips pure noise.
  // Only surface them once the roster is far enough along to constrain.
  const open=(d.needs&&d.needs.open_slots)||{};
  const openList=Object.entries(open);
  if(openList.length && openList.length<=4)
    openList.forEach(([s,n])=>ch.push(`<span class="chip need">need ${s}${n>1?" ×"+n:""}</span>`));
  else if(openList.length)
    ch.push(`<span class="chip need">${openList.length} slots open</span>`);
  // Bye stacking: wk14 is the last week before playoffs, wk11 has six teams out.
  const byes={};
  (d.mine||[]).forEach(p=>{ if(p.bye) byes[p.bye]=(byes[p.bye]||0)+1; });
  Object.entries(byes).filter(([,n])=>n>=3).forEach(([wk,n])=>
    ch.push(`<span class="chip cliff">bye wk${wk}: ${n} players</span>`));

  const cnt=(d.needs&&d.needs.counts)||{};
  const have=Object.entries(cnt).map(([p,n])=>`${p}${n}`).join(" ");
  if(have) ch.push(`<span class="chip have">roster: ${have}</span>`);
  el("chips").innerHTML = ch.join("");

  buildSlots((d.league&&d.league.teams)||10, d.league&&d.league.my_slot);

  // freshness: measured from when the pick count last moved, not from polls
  if(d.drafted_count !== lastCount){ lastCount = d.drafted_count; lastChange = Date.now(); }
  renderFeed(d);
  tickAge();   // paint immediately rather than waiting for the next tick

  const mineView = pos==="MINE";
  let list = mineView ? d.mine
                      : d.available.filter(p=>pos==="ALL"||p.pos===pos);
  // Weighted order pushes covered positions down without hiding them, so
  // tier bands would fragment; tiers move inline instead.
  const banded = !weighted || mineView;
  if(!mineView && weighted)
    list = list.slice().sort((a,b)=>(a.adj_rank-b.adj_rank)||(a.my_rank-b.my_rank));
  const tb=el("rows"); tb.innerHTML="";
  if(!list.length){
    tb.innerHTML=`<tr><td class="empty">${
      mineView?"you haven't drafted anyone yet":"nobody left here"}</td></tr>`;
    return;
  }

  let tier=null;
  list.forEach(p=>{
    if(mineView){
      const tr=tb.insertRow(); tr.className="p mine";
      const rk=tr.insertCell(); rk.className="rk num"; rk.textContent=p.my_rank;
      const nm=tr.insertCell(); nm.className="nm"; nm.colSpan=4;
      nm.innerHTML=`${p.name}<span class="meta">${p.pos} · ${p.team}`
        +(p.bye?` · bye ${p.bye}`:``)+` · tier ${p.tier}</span>`;
      return;
    }
    const t = pos==="ALL" ? p.tier : p.pos_tier;
    const tn = pos==="ALL" ? p.tier_name : p.pos_tier_name;
    if(banded && t!==tier){
      tier=t;
      const tr=tb.insertRow(); tr.className="tierhdr";
      const td=tr.insertCell(); td.colSpan=5; td.textContent = tn || ("Tier "+t);
    }
    const tr=tb.insertRow();
    tr.className = "p" + (p.need_tag==="depth" ? " dep" : "");
    tr.onclick=e=>{ if(e.target.classList.contains("act")) return;
                    post("/api/pick",{espn_id:p.espn_id,mine:false}); };

    const rk=tr.insertCell(); rk.className="rk num";
    rk.textContent = pos==="ALL" ? p.my_rank : p.pos_rank;

    const nm=tr.insertCell(); nm.className="nm";
    const dl = p.delta>0 ? ` <span class="dl">+${p.delta}</span>` : "";
    const tag = (weighted && p.need_tag && p.need_tag!=="starter")
      ? ` <span class="tag ${p.need_tag}">${p.need_tag}</span>` : "";
    const sc = (weighted && p.scarcity>=2)
      ? ` <span class="tag sc" title="tier ${Math.round(p.p_tier_gone*100)}% likely gone by pick ${d.horizon}">scarce +${Math.round(p.scarcity)}</span>` : "";
    const tierBit = (!banded && t!=null) ? ` · T${t}` : "";
    nm.innerHTML = `${p.name}${tag}${sc}<span class="meta">${p.pos} · ${p.team}`
      + (p.bye?` · bye ${p.bye}`:``) + tierBit + `</span>${dl}`
      + (p.flags?`<span class="flag">${p.flags}</span>`:``);

    const sv=tr.insertCell(); sv.className="sv";
    sv.innerHTML=`<span class="b ${p.survival}">${
      {safe:"safe",coinflip:"50/50",gone:"gone",unknown:"—"}[p.survival]||"—"}</span>`;

    const ad=tr.insertCell(); ad.className="rk num";
    ad.textContent = p.espn_live_adp ? p.espn_live_adp.toFixed(0) : "";

    const act=tr.insertCell(); act.className="act"; act.textContent="+";
    act.title="add to my roster";
    act.onclick=()=>post("/api/pick",{espn_id:p.espn_id,mine:true});
  });

  el("foot").textContent =
    `${d.available.length} available · ${d.drafted_count} drafted · you have ${d.mine.length}`;
}

function renderFeed(d){
  const f = el("feed"), r = d.recent || [];
  if(!r.length){ f.innerHTML = `<div class="fp"><span class="m">no picks yet</span></div>`; return; }
  // Re-render only when the set changes, so the flash animation means
  // "this is new" rather than firing on every poll.
  const sig = r.map(x=>x.pick+":"+x.name).join("|");
  if(f.dataset.sig === sig) return;
  f.dataset.sig = sig;
  f.innerHTML = r.map(x =>
    `<div class="fp${x.mine?" me":""}">
       <span class="n"><span class="pk">${x.pick}</span>${x.name}</span>
       <span class="m">${x.pos} · ${x.team}${x.by?" · "+x.by:""}</span>
     </div>`).join("");
}

function tickAge(){
  const a = el("age");
  if(lastCount === null){ a.textContent = ""; return; }
  const s = Math.round((Date.now()-lastChange)/1000);
  a.textContent = s<60 ? `${s}s ago` : `${Math.floor(s/60)}m ${s%60}s ago`;
  a.className = "age" + (s>400 ? " dead" : s>150 ? " stale" : "");
}
setInterval(tickAge, 1000);

function buildSlots(n, cur){
  const s=el("slot");
  if(s.dataset.n==String(n) && s.value==String(cur??"")) return;
  s.dataset.n=n; s.innerHTML="";
  const o=document.createElement("option"); o.value=""; o.textContent="?"; s.appendChild(o);
  for(let i=1;i<=n;i++){
    const x=document.createElement("option"); x.value=i; x.textContent=i; s.appendChild(x);
  }
  s.value = cur==null ? "" : String(cur);
}
el("slot").onchange=e=>post("/api/slot",{slot:e.target.value?+e.target.value:null});
el("undo").onclick=()=>post("/api/undo");
el("mode").onclick=()=>{ weighted=!weighted;
  el("mode").textContent = weighted ? "Weighted" : "Board";
  el("mode").style.borderColor = weighted ? "var(--accent)" : "var(--line)";
  render(last); };
el("mode").style.borderColor="var(--accent)";

tabs();
fetch("/api/state").then(r=>r.json()).then(render);
const es=new EventSource("/api/events");
es.onmessage=e=>render(JSON.parse(e.data));
es.onerror=()=>{el("dot").className="dot error"};
</script>
</body>
</html>
